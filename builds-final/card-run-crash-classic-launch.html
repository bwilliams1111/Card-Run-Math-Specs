<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Run Crash 20×</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800&family=Chakra+Petch:wght@600;700&family=Anton&family=Montserrat:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a phone-sized game column with a live math panel beside it on wide screens, below it on phones. Single dark look, matching the existing Card Run build. */
:root{
  color-scheme: dark;
  --bg:#071328; --bg2:#0c2246; --panel:#0b1c39; --panel2:#10264a; --line:#1d3a66; --line2:#2a4f86;
  --fg:#e9f0ff; --muted:#7e93b9; --dim:#4f6589;
  --gold:#ffcf3d; --gold2:#f0a400; --red:#ef3b46; --red-soft:#ff6b74; --blue:#2f6bff; --blue2:#1d4fd6;
  --green:#3fc46a; --cardface:#ffffff; --cardink:#121826; --orange:#f28c28;
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Chakra Petch","Rubik",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);padding-inline:16px;padding-block:18px 40px;
  background:radial-gradient(1200px 600px at 30% -10%,#123060 0%,transparent 60%),var(--bg);min-height:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.gamecol{width:100%;max-width:420px;flex:0 1 420px;min-width:0}


/* phone */
.phone{position:relative;background:linear-gradient(180deg,#0d2448 0%,#0a1c3a 60%,#091833 100%);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:clamp(560px,calc(100vh - 110px),680px);min-height:clamp(560px,calc(100dvh - 110px),680px);display:flex;flex-direction:column}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#fff 0 2px,transparent 3px);background-size:90px 90px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #0f2b55;font-size:12px}
.topbar .brand{font-weight:800;letter-spacing:.06em}
.topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0a1a35;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.pill .k{color:var(--gold)}
.pill.net.pos{color:var(--green)} .pill.net.neg{color:var(--red-soft)}
.screen{position:relative;flex:1;display:flex;flex-direction:column;padding:12px 14px 16px;gap:12px}

/* rules panel */
.rules{background:rgba(6,16,34,.75);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.rules .r{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:#b9c7e4}
.rules .r+.r{border-top:1px solid #15305a}
.rules .r b{color:var(--fg);font-weight:600}
.rules .r .end{white-space:nowrap;margin-left:auto;font-weight:700;color:var(--fg)}
.rules .r .end em{font-style:normal;font-family:var(--f-display);font-size:18px;color:var(--gold);margin-right:4px}
.ico{width:16px;height:16px;flex:none}

/* deck row */
.deckrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:4px}
.stat{background:rgba(9,22,46,.85);border:1px solid #16345f;border-radius:10px;padding:7px 8px;text-align:center}
.stat .l{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.stat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stat.ammo .v{color:var(--gold)} .stat.mult .v{color:#9cc0ff}
.deck{position:relative;width:62px;height:88px;cursor:pointer}
.deck .cb{position:absolute;inset:0}
.deck .cb:nth-child(1){transform:translate(3px,6px)} .deck .cb:nth-child(2){transform:translate(1.5px,3px)}
.deck.shuffling .cb:nth-child(1){animation:rifL .52s ease-in-out}
.deck.shuffling .cb:nth-child(2){animation:rifM .52s ease-in-out}
.deck.shuffling .cb:nth-child(3){animation:rifR .52s ease-in-out}
@keyframes rifL{0%,100%{transform:translate(3px,6px)}35%{transform:translate(-30px,6px) rotate(-14deg)}60%{transform:translate(-24px,4px) rotate(-9deg)}}
@keyframes rifM{0%,100%{transform:translate(1.5px,3px)}45%{transform:translate(1.5px,-10px)}}
@keyframes rifR{0%,100%{transform:none}35%{transform:translate(30px,0) rotate(14deg)}60%{transform:translate(24px,-2px) rotate(9deg)}}
.bigbtn{position:relative;overflow:hidden}
.autotog{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid #1d3a66}
.autotog .sw{width:28px;height:16px;border-radius:999px;background:#1d3a66;position:relative}
.autotog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#7e93b9;transition:left .15s}
.autotog[aria-pressed="true"]{color:var(--gold);border-color:#6b5200}
.autotog[aria-pressed="true"] .sw{background:#6b5200}
.autotog[aria-pressed="true"] .sw::after{left:14px;background:var(--gold)}
.bigbtn.info{cursor:default}
.deckcap{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
.deckcap b{color:var(--fg);font-size:14px}

/* cards */
.card{position:relative;width:62px;height:88px;border-radius:7px;background:var(--cardface);color:var(--cardink);box-shadow:0 4px 10px rgba(0,0,0,.35);flex:none;user-select:none}
.card.red{color:#d81f2a}
.card .tl{position:absolute;left:5px;top:3px;font-weight:800;font-size:15px;line-height:1}
.card .br{position:absolute;right:5px;bottom:3px;font-weight:800;font-size:15px;line-height:1;transform:rotate(180deg)}
.card .pip{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%)}
.card .pip svg{width:100%;height:100%;fill:currentColor}
.cb{width:62px;height:88px;border-radius:7px;background:linear-gradient(160deg,#2a5aa8,#183b78 55%,#132f62);border:2px solid #8fb3ee;box-shadow:inset 0 0 0 3px #173a73,0 4px 10px rgba(0,0,0,.35);display:grid;place-items:center}
.cb svg{width:34px;height:34px}
.slots{display:flex;gap:8px;justify-content:center;min-height:92px;align-items:center;margin-block:4px 8px}
.slot{width:62px;height:88px;border-radius:7px;border:1px dashed #1d3a66;background:rgba(8,20,42,.5);flex:none}
.card.hl{box-shadow:0 0 0 2px #ff4b57,0 0 18px rgba(255,60,70,.7)}
.card.dim{filter:grayscale(.6) brightness(.55)}
.dealin{animation:dealin .32s cubic-bezier(.2,.8,.3,1)}
@keyframes dealin{from{transform:translateY(-120px) rotateY(80deg) scale(.8);opacity:.2}to{transform:none;opacity:1}}

/* badges & messages */
.badge{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid #2a5592;background:#0a1d3d;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#9cc0ff}
.msg{text-align:center;min-height:38px}
.msg h3{margin:0;font-family:var(--f-display);font-size:17px;letter-spacing:.05em;color:#6fd3ff;text-wrap:balance}
.msg p{margin:2px 0 0;font-size:12px;color:#b9c7e4}
.msg.good h3{color:var(--green)}

/* bottom controls */
.controls{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.bigbtn{border-radius:14px;padding:9px 12px;text-align:center;background:#0b1b38;border:1px solid #1d3a66;display:flex;align-items:center;justify-content:center;gap:16px;min-height:58px}
.bigbtn .lab{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.bigbtn .amt{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.bigbtn.next .amt{color:#c9d6ef}
.bigbtn.cash{border:2px solid var(--gold);background:#0c1a33;box-shadow:0 0 18px rgba(255,200,60,.25)}
.bigbtn.cash .lab{color:var(--gold)} .bigbtn.cash .amt{color:var(--gold)}
.bigbtn.bust{border-color:#6b2232;background:#1d0d1a}
.bigbtn.bust .lab,.bigbtn.bust .amt{color:var(--red-soft)}
.bigbtn .s{width:14px;height:14px;fill:var(--red)}
.btn{border-radius:12px;padding:8px 10px;background:#0b1b38;border:1px solid #1d3a66;font-weight:700;font-size:12px;letter-spacing:.08em;line-height:1.2;text-align:center}
.btn small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:600}
.btn .a{font-size:16px;font-variant-numeric:tabular-nums}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold small{color:#d9b54a}
.btn.yellow{background:linear-gradient(180deg,#ffd84d,#f2a900);border-color:#ffe17a;color:#1b1400}
.btn.yellow small{color:#4a3800}
.btn:disabled{opacity:.35}


/* result overlay */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.won{font-family:var(--f-display);font-size:34px;color:var(--gold);letter-spacing:.02em;text-shadow:0 2px 0 #6b4a00}
.sub{font-size:13px;color:#b9c7e4}
.chip{white-space:nowrap;display:inline-block;padding:2px 8px;border-radius:6px;background:#12305c;color:#9cc0ff;font-size:11px;font-weight:700;letter-spacing:.08em}

/* lobby */
.lobby{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.logo .w{font-family:var(--f-display);font-size:34px;letter-spacing:.04em;line-height:1}
.lobby .logo .w{font-family:"Chakra Petch",Montserrat,system-ui,sans-serif;font-weight:700;font-size:clamp(34px,11vw,46px);letter-spacing:.03em}   /* 14 Oct: heading weight matches the other three lobbies */
.logo .w span{color:var(--gold)}
.logo{margin-bottom:6px}   /* CRASH 20× heading: no variant line under it */
.lobby h4{margin:6px 0 0;font-size:11px;letter-spacing:.2em;color:var(--gold)}
.betinput{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #2a3f66;background:#0c1730;border-radius:999px;padding:6px 6px 6px 18px}
.betinput .cur{color:var(--gold);font-weight:800;font-size:19px}
.betinput input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:800 19px var(--f-ui);outline:none;-moz-appearance:textfield}
.betinput input::-webkit-outer-spin-button,.betinput input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.betinput button{border:1px solid #2a3f66;border-radius:999px;padding:8px 16px;font-weight:800;font-size:12px;letter-spacing:.1em;color:#b9c7e4;background:#111f3d}
.betinput:focus-within{border-color:var(--gold)}
.pitch{display:flex;flex-direction:column;align-items:center;gap:3px}
.pitch{gap:8px!important}
.pitch .phlogo{display:block;width:min(88%,330px);height:auto;margin:2px auto 0}
.pitch .ps{font-size:13.5px;color:#c3cde4;letter-spacing:.01em;text-align:center;white-space:nowrap;margin:0 -20px;display:flex;align-items:center;justify-content:center}
.pitch .ps .dot{display:inline-block;width:.38em;height:.38em;border-radius:50%;background:#aeb9d6;margin:0 .6em;flex:none}

.eqn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.eq{flex:1;min-width:0;border:1px solid #2a4f86;border-radius:10px;padding:6px 4px;background:#0a1a35;display:flex;flex-direction:column;align-items:center}
.eq .el{font-size:9px;letter-spacing:.1em;white-space:nowrap;color:var(--muted);font-weight:700}
.eq .ev{font-family:"Barlow Condensed","Rubik",system-ui,sans-serif;font-weight:800;font-size:clamp(16px,5.2vw,22px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq.max{border-color:var(--gold);background:#2a2100;flex:1.45}
.eq .ev.long{font-size:clamp(14px,4.3vw,18px)}
.eq.max .ev{color:var(--gold)}
.eqn .op{font-family:"Barlow Condensed","Rubik",system-ui,sans-serif;font-weight:800;font-size:22px;color:var(--muted)}
.lobbyfacts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lobbyfacts .stat .v{font-size:15px}
.lobbydesc{font-size:13px;color:#b9c7e4;max-width:34ch;line-height:1.45;margin:0}
.startbtn{width:100%;min-height:54px;font-size:15px}

/* run game */
.race{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.track{background:rgba(9,22,46,.85);border:1px solid #16345f;border-radius:12px;padding:10px;text-align:center}
.track .l{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:6px}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #2a4f86;background:#0a1a35}
.dot.r{background:var(--red);border-color:#ff8088;box-shadow:0 0 10px rgba(239,59,70,.6)}
.dot.b{background:#d9e2f5;border-color:#fff}


@media (max-width:440px){
  .card,.cb,.slot,.deck{width:56px;height:80px}
  .bigbtn{gap:8px;padding-inline:8px}
  .bigbtn .lab{font-size:9.5px;letter-spacing:.1em;white-space:nowrap}
  .topbar{gap:6px;padding-inline:10px}
}

/* ===== Button rules (GRP 1.2) ===== */
.door{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:999px;border:1px solid #23406e;background:#0a1a35;color:#c6d0e8;font-size:11px;font-weight:700;letter-spacing:.04em}
.door svg{width:16px;height:16px}
.board{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.won.plain{color:#fff;text-shadow:none}
.rgpanel{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.rgpanel b{font-family:var(--f-display);font-size:18px;letter-spacing:.14em}
.rgpanel small{font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:700}
.startbtn{display:flex;flex-direction:column;align-items:center;gap:1px}
.startbtn small{font-size:11.5px;letter-spacing:.14em;font-weight:800}
.startbtn .a{font-size:20px;font-weight:800}
.screen.tight{gap:8px;padding-bottom:8px}
.screen.tight .rules .r{padding:5px 0}
.screen.tight .deckrow{margin-top:0}
.lockwrap.off{visibility:hidden;pointer-events:none}
.compact .bigbtn,.compact .btn{min-height:48px!important;padding-block:4px}
.compact .bigbtn .amt{font-size:19px}
.racerow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.racerow .rbslot,.racerow .crk-one,.racerow .crk-lc{height:100%}
.racerow .crk-gold{height:100%;min-height:76px}
.racerow .bigbtn{min-height:76px;height:100%}

/* ===== Run phase v152 hosts ===== */
.rbslot[data-rb="bar"]{background:#0a1838;border-radius:18px;padding:16px 10px 10px;border:1px solid #142d58}
.rbslot[data-rb="lock"],.rbslot[data-rb="end"]{display:block}
.crk-gold{width:100%}
.toasthost{position:relative;min-height:190px;width:100%}
.crk-toast .eh,.crk-toast .et,.crk-toast .es,.crk-toast .crk-chip{white-space:nowrap}
.crk-toast.crk-plain .et{color:#fff;font-size:21px;font-weight:800}   /* at or below the stake: plain white, smaller, never celebrated */
/* run-bar v170 is embedded verbatim; these host rules keep the launch look the v167 hand port had (no visual change) */
html body .crk-toast.crk-plain .et{color:#fff;font-size:21px;font-weight:800}   /* beats the module's .crk-toast .et.plain */
html body .crk-dbl{height:auto;min-height:66px;overflow:visible}
html body .crk-dbl .t,html body .crk-dbl .a,html body .crk-dbl .s{line-height:inherit}
html body .crk-hl{font-family:"Chakra Petch",Montserrat,system-ui,sans-serif}
html body .crk-toast{background:rgba(8,12,30,.5);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:crkToastIn .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes crkToastIn{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.boardlabel{letter-spacing:.16em;font-size:11px;font-weight:700;color:#c3cde4}
.board .crk-bust{top:28%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== LAUNCH BUILD (Classic only) ===== */
/* full-bleed phone column, like the Blackjack launch build (max 460px, no page gutter) */
html,html body{height:100%}
html body{padding:0;margin:0}
html .wrap{gap:0;max-width:none;height:100%}
html .gamecol{max-width:460px;flex:1 1 auto;height:100%}
html .phone{border:0;border-radius:0;min-height:100%;height:100%;overflow-y:auto}
/* lobby: the BUILD x RUN = WIN strip, bet, facts and start button are pinned to the bottom of the screen (as in the Blackjack launch lobby) */
.lobby{flex:1}
.lobbyfoot{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px}
/* v163-v164 run deck: ONE whole-screen dim at 65%, fading in with the run bar (0.35 s, no 1.2 s beat); only the run bar sits above it */
#scrim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:900;transition:opacity .2s ease}
.phone.dimscreen #scrim{opacity:var(--dimA,.65);transition:opacity .35s cubic-bezier(.2,.8,.3,1) 0s}
.phone.dimscreen [data-rb="bar"]{position:relative;z-index:901}
@media (prefers-reduced-motion:reduce){#scrim{transition:none!important}}

/* ===== lobby brand: same logo, size and tagline as Kicks (63% of the lobby, max 357px; Saira tagline) ===== */
.pitch .phlogo{display:block;width:min(calc(.63 * (100vw - 32px)),357px,100%);max-width:none;height:auto;margin:0 auto}
.pitch div.ps{display:block;margin:8px 0 0;padding:0;font-family:Saira,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;font-size:clamp(10px,2.7vw,12.5px);line-height:1.3;letter-spacing:normal;color:#b9c3e3;white-space:nowrap;text-align:center}
.pitch div.ps .tg-nw{white-space:nowrap}
.pitch div.ps .tg-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:#8491b8;margin:0 .6em;vertical-align:middle;flex:none}
.pitch{gap:0!important}   /* the tagline sits 8px under the logo, as in Kicks */
/* EBG shell: the Parlay window bar carries the game name and close, so the game's own lobby door and title are removed (hidden, not clickable) */
.topbar .door,.topbar .brand,#net{display:none!important}   /* #net: the session P&L pill is removed too */
.lobbydesc{max-width:40ch;text-wrap:balance;margin-inline:auto}   /* balanced: the description lines come out the same width (as in Kicks) */
/* EBG shell: while PLAY AGAIN (or CHANGE BET) is up, the whole game screen dims to 70%; the end bar and the end toast / BUSTED stamp sit above it */
.phone.enddim #scrim{opacity:.7;transition:opacity .35s cubic-bezier(.2,.8,.3,1) 0s}
.phone.enddim .controls{position:relative;z-index:901}
.phone.enddim .crk-toast,.phone.enddim .crk-bust{z-index:902}

/* ===== PLAY AGAIN (and CHANGE BET): the shared end-of-round button ===== */
html body .crk-one .crk-gold:is([data-act="again"],[data-act="change"]){all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:78px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 18px;text-align:center;
  background:linear-gradient(180deg,#f9da80 0%,#efc356 50%,#e2aa3c 100%);border:1.5px solid #f7de90;color:#141a29;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(150,95,10,.25),0 6px 16px rgba(0,0,0,.35);font-family:Montserrat,Rubik,system-ui,sans-serif;transition:transform .08s,filter .15s}

/* the board as the player last saw it, for the end toast to sit on (cards stay; deal-in animations, stamps and toasts are dropped) */
function boardSnap(){ const b=screenEl.querySelector('#board'); if(!b) return null; const c=b.cloneNode(true);
  c.querySelectorAll('.dealin').forEach(e=>e.classList.remove('dealin')); c.querySelectorAll('.crk-toast,.crk-bust').forEach(e=>e.remove());
  c.classList.remove('crk-dimmable','crk-dim'); c.removeAttribute('data-toast'); return c.outerHTML; }
const toastBoard=(r,cfg)=> r.boardHTML ? r.boardHTML.replace('id="board"', `id="board" data-toast='${cfg}'`) : `<div class="board toasthost" id="board" data-toast='${cfg}'></div>`;
function endPaid(st,held,kind){
  const bank=st.buy.runBanked, total=settle(st,held);   // one credit: RUN BANK + held
  track('cap_reached',{total:total/100,source:kind==='mw'?'max_win':'run_cap'});
  st.bar=null; st.bankedBust=null; st.pending=null;
  st.result={kind,last:total,runBank:bank,boardHTML:boardSnap()}; st.screen='result';
}
const celebrate=(st,amt)=>amt>st.buy.orig;   // a return at or below the stake is never celebrated
function renderChoice(id,st){
  const P=st.pending||{cards:[],leg:{j:0}}; let h='';
  const shown=(P.cards||[]).slice(-4);
  const head= (P.top?'TOP RED REACHED · RED #':'LOCKED IN AT RED #')+P.leg.j;
  const amt=st.bar?st.bar.held:P.amount;
  h+=`<div class="board" id="board"><div class="result" style="margin-top:18px;gap:10px"><div class="sub boardlabel">${head}</div><div class="${celebrate(st,amt)?'won':'won plain'}">${fmt(amt)}</div>${st.buy.kept?`<div class="sub boardlabel">BANKED ${fmt(st.buy.kept)}</div>`:''}</div>
    <div class="slots">${shown.map(c=>cardHTML(c,'dim')).join('')}</div></div>`;
  h+=`<div class="controls">${st.bar?ribbon('bar'):''}</div>`;
  return h;
}
/* LOCK IN: one module instance per leg and RUN BANK; live only while a red is the latest card */
function lockSlot(st,leg,cur){
  const bank=st.buy.runBanked, mw=st.buy.mw-st.buy.paid;
  return `<div class="lockwrap ${leg.live&&leg.state==='play'?'':'off'}">`+ribbon('lock',{leg:leg.uid,banked:bank/100,maxWin:mw/100,half:false,h:leg.h})+`</div>`;
}
/* a slot the RunBar module draws into after each render (memoised so unrelated re-renders never remount it) */
const ribbon=(mode,cfg)=>`<div class="crk-ribbon rbslot" data-rb="${mode}" ${cfg?`data-cfg='${JSON.stringify(cfg).replace(/'/g,'&#39;')}'`:''}></div>`;

/* ================= rendering ================= */
const screenEl=document.getElementById('screen');
let seen=new Set();
function animClass(id){ if(seen.has(id))return ''; seen.add(id); return 'dealin'; }

/* end of a crash: one toast, then LOBBY / PLAY AGAIN slide up in place */
function endCrash(st,check,delay=650,title,sub){ setTimeout(()=>{ if(!check())return; settle(st); st.ended={kind:'crash',shown:false,title,sub}; render(); },delay); }
/* bust: the BUSTED stamp sits on the board (RunBar.bustStamp, drawn after render); the ribbon becomes the end bar */
function endControls(st){ st.ended.shown=true; return ribbon('end'); }
/* the end bar (RunBar.renderEnd): PLAY AGAIN / $bet, or CHANGE BET / BALANCE $N -> lobby */
const buildUpTo=(id,S)=>Math.min(tdef(id).x*S,maxWinC(S));
const startLabel=(id,S)=>`BUILD ${tdef(id).x.toLocaleString('en-US')}× · ${fmt(buildUpTo(id,S))}`;   // the start button: BUILD 20× · $N (N = 20 x the bet)
function renderTop(){
  document.getElementById('wallet').textContent=(app.wallet/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const n=document.getElementById('net'); n.textContent=(app.net>=0?'+':'−')+(Math.abs(app.net)/100).toFixed(2);
  n.className='pill net '+(app.net>0?'pos':app.net<0?'neg':'');
}
/* keep the lobby tagline on one line: shrink it to the width of the phone */
function fitTag(){ const ps=screenEl.querySelector('.pitch .ps'); if(!ps)return; ps.style.fontSize='';
  const box=screenEl.clientWidth-20, w=ps.scrollWidth; if(w>box){ const f=parseFloat(getComputedStyle(ps).fontSize); ps.style.fontSize=Math.max(9,f*box/w*0.98).toFixed(2)+'px'; } }
addEventListener('resize',()=>fitTag());
/* big amounts shrink to fit on one line; they never wrap or clip */
function fitAll(){ screenEl.querySelectorAll('[data-fit]').forEach(el=>{ el.style.fontSize=''; const w=el.scrollWidth, box=el.parentElement.clientWidth-8;
  if(w>box&&box>0){ const f=parseFloat(getComputedStyle(el).fontSize); el.style.fontSize=Math.max(10,f*box/w*0.97).toFixed(1)+'px'; } }); }
/* input lock: for 350 ms after a button set swaps in, taps / clicks / Enter / Space are ignored; focus moves to the primary action */
let ctlSig='', lockUntil=0;
function inputLock(){
  const c=screenEl.querySelector('.controls'), sig=(app.tab+'|')+(c?[...c.querySelectorAll('[data-act]')].map(b=>b.dataset.act).join(','):'');
  if(sig===ctlSig)return; ctlSig=sig;
  if(c&&c.querySelector('[data-act]')){ lockUntil=performance.now()+350; const p=c.querySelector('[data-primary]'); if(p&&!CardRunRules.isOpen()){ try{p.focus({preventScroll:true})}catch(e){} } }
}
/* RunBar v152 slots: the module draws the bar, end bar, hand-offs and LOCK IN into [data-rb] after each render.
   Memoised by state, so an unrelated re-render re-attaches the same buttons (no new animation, focus or input lock). */
let RB_MEMO=new Map(), RB_HANDLE=new Map();
function mountRibbons(st){
  const keep=new Map(), keepH=new Map();
  const liveAmt=()=>{ if(st.screen==='run'&&st.run) return st.run.offer/100; const L=st.leg; return L&&L.j?riding(L)/100:0; };
  screenEl.querySelectorAll('[data-rb]').forEach(el=>{
    const mode=el.dataset.rb, cfg=el.dataset.cfg?JSON.parse(el.dataset.cfg):null;
    const key=[st.id,st.buy&&st.buy.id,mode, mode==='bar'?JSON.stringify(barState(st)) : mode==='end'?st.stake+'|'+app.wallet : el.dataset.cfg].join('|');
    const old=RB_MEMO.get(key);
    if(old){ el.appendChild(old); keep.set(key,old); const hd=RB_HANDLE.get(key); if(hd){ hd.set(liveAmt()); keepH.set(key,hd); } return; }
    if(mode==='bar') RunBar.render(el,barState(st),{cashOut:()=>act('bar-cash'),double:()=>act('bar-double'),doubleHalf:()=>act('bar-doublehalf'),
      paidOut:k=>setTimeout(()=>{ if(!st.bar)return; const r=RunBar.compute(barState(st)); endPaid(st,r.held,k==='max_win'?'mw':'run'); render(); },0)});
    else if(mode==='end') RunBar.renderEnd(el,{bet:st.stake/100,balance:app.wallet/100},{playAgain:()=>act('again'),changeBet:()=>act('lobby')});
    else if(mode==='lock'){ const L=st.leg;
      const hd=RunBar.renderLockIn(el,{...cfg,amount:liveAmt()},{lockIn:()=>act(cfg.act||'cashout'),
        paidOut:()=>setTimeout(()=>{ if(cfg.act==='racelock'){ if(st.run&&st.run.state==='play') raceLock(st), render(); return; } if(st.leg!==L||L.state!=='play')return; clearTimeout(L.timer); L.state='ended'; endPaid(st,Math.max(0,st.buy.mw-st.buy.paid-st.buy.runBanked),'mw'); render(); },0)});
      keepH.set(key,hd); }
    if(el.firstElementChild) keep.set(key,el.firstElementChild);
  });
  RB_MEMO=keep; RB_HANDLE=keepH;
}
/* board decorations drawn by the module: the BUSTED stamp, the MAX WIN / 1,000x RUN toast, and the board dim ("double cover") */
/* toast lines never wrap: a line that is too long shrinks to fit */
function fitToast(t){ t.querySelectorAll('.eh,.et,.es,.crk-chip').forEach(el=>{ el.style.fontSize=''; const box=t.clientWidth-30, w=el.scrollWidth; if(w>box&&box>0){ const f=parseFloat(getComputedStyle(el).fontSize); el.style.fontSize=(f*box/w).toFixed(2)+'px'; } }); }
let dimKey='';
function decorate(st){
  const board=screenEl.querySelector('#board');
  if(board&&(st.bankedBust||(st.ended&&!st.ended.title))) RunBar.bustStamp(board,{runBank:st.bankedBust?st.bankedBust.B/100:0});
  screenEl.querySelectorAll('[data-toast]').forEach(h=>{ const cfg=JSON.parse(h.dataset.toast), t=RunBar.toast(h,cfg); if(cfg.plain) t.classList.add('crk-plain'); fitToast(t); });
  const rib=screenEl.querySelector('[data-rb="bar"]'), phone=document.getElementById('phone');
  phone.style.setProperty('--dimA',DIM);
  phone.classList.toggle('dimscreen',!!(st.bar&&rib));
  phone.classList.toggle('enddim',!!screenEl.querySelector('[data-rb="end"]'));   // end of round: 70% screen dim under PLAY AGAIN   // v163-164: the whole screen dims while the run bar is up; it fades in with the bar
}
function render(){
  renderTop();
  const st=app.S[app.tab]; const id=app.tab;
  let h='';
  if(st.screen==='lobby') h=renderLobby(id,st);
  else if(st.screen==='crash') h=renderCrash(id,st);
  else if(st.screen==='run') h=renderRun(id,st);
  else if(st.screen==='result') h=renderResult(id,st);
  else if(st.screen==='choice') h=renderChoice(id,st);
  screenEl.classList.toggle('tight',st.screen==='crash');
  screenEl.innerHTML=h;
  fitTag(); fitAll(); inputLock();
  mountRibbons(st); decorate(st);
}

function rulesPanel(){
  const rows=[`<div class="r">${heartIco}<b>Lock wins on red cards</b></div>`,
    `<div class="r">${SYM.warn}<span>Repeating Clubs or Spades = CRASH <b style="color:var(--gold);font-weight:600">after 1st red</b></span></div>`];
  return `<div class="rules">${rows.join('')}</div>`;
}
function maxPayout(id,S){
  const cfg=CFG[id]; const j=capRung(cfg,S,tdef(id).cap*S); return {j,v:ladder(cfg,S,j),p:reach(cfg,j)};
}
/* Bet entry matches the Blackjack lobby: an amount field with MAX */
const TABLE_MIN=100, TABLE_MAX=10000, BET_STEP=10;   // bets: $1.00 to $100.00 in $0.10 steps (integer cents)
const snapBet=c=>Math.max(TABLE_MIN,Math.min(TABLE_MAX,Math.floor(c/BET_STEP)*BET_STEP));   // off the grid snaps DOWN to $0.10, then clamps to [$1, $100]: never $0.00
function setStake(st,c){ if(typeof c!=='number'||Number.isNaN(c))return; st.stake=snapBet(c); }
/* the bet field: a plain decimal only (digits with one optional point). Empty, NaN, exponents (1e2), signs (-5) and text are
   rejected (null: the bet stays as it was). Parsed exactly from the digits: whole dollars and the first decimal (tenths). */
function parseBetCents(v){ const s=String(v==null?'':v).trim(); if(!/^(\d+(\.\d*)?|\.\d+)$/.test(s))return null;
  const p=s.split('.'), tenths=(p[1]||'')+'0'; return (Number(p[0]||'0')*10+Number(tenths[0]))*BET_STEP; }

function renderLobby(id,st){
  const t=tdef(id), S=st.stake;
  const desc={
    classic:'Flip cards one by one: every red pays a higher multiplier, and a repeated black suit crashes the build after the first red'
  }[id];
  const mp=maxPayout(id,S);
  const facts=
     `<div class="stat"><div class="l">FIRST RED</div><div class="v" style="color:var(--gold)">${fmt(ladder(CFG[id],S,1))}</div></div><div class="stat"><div class="l">TOP RUNG (RED #${mp.j})</div><div class="v">${fmt(mp.v)}</div></div>`;
  const runMax=Math.min(t.x*RUN_CAP_X,MAX_WIN_X,OPERATOR_MAX_WIN_X);   // WIN UP TO never promises more than MAX WIN
  return `<div class="lobby">
    <div class="pitch"><img class="phlogo" src="${BRLOGO_K}" alt="BUILD IT. RUN IT." width="1100" height="167"><div class="ps"><span class="tg-nw">Build a 20× win</span><span class="tg-dot" aria-hidden="true"></span><span class="tg-nw">then take it on a 1,000× run</span></div></div>
    <div class="logo">${LOGO.replace('<svg','<svg width="56" height="56"')}
      <div class="w">CRASH 20×</div></div>
    <p class="lobbydesc">${desc}</p>
    <div class="lobbyfoot">
    <div class="eqn"><div class="eq"><span class="el">BUILD</span><span class="ev">${t.x.toLocaleString('en-US')}×</span></div><span class="op">×</span><div class="eq"><span class="el">RUN</span><span class="ev">1,000×</span></div><span class="op">=</span><div class="eq max"><span class="el">WIN UP TO</span><span class="ev ${runMax>=1e6?'long':''}" data-fit>${runMax.toLocaleString('en-US')}×</span></div></div>
    ${st.paused?'':`<div class="betinput"><span class="cur">$</span><input id="bet-${id}" type="number" inputmode="decimal" min="${TABLE_MIN/100}" max="${TABLE_MAX/100}" step="${BET_STEP/100}" value="${(S/100).toString()}" aria-label="Bet amount in dollars" data-bet="${id}"><button data-act="betmax">MAX</button></div>`}
    <div class="lobbyfacts">${facts}</div>
    ${st.paused?`<button class="btn yellow startbtn" data-act="resume" data-primary><span class="a">RESUME ROUND</span></button>`
      : app.wallet>=S?`<button class="btn yellow startbtn" data-act="start" data-primary><span class="a">${startLabel(id,S)}</span></button>`
      : `<div class="sub" style="color:var(--red-soft)">BALANCE ${fmt(app.wallet)} · LOWER THE BET</div>`}
    </div>
  </div>`;
}

function renderCrash(id,st){
  const leg=st.leg, cfg=leg.cfg, S=leg.S;
  const cur=leg.j?riding(leg):0, next=riding(leg,leg.j+1);
  const mult=leg.j?ladder(cfg,S,leg.j)/S:(cfg.opening?1:1);
  let h='';
  h+=rulesPanel();
  h+=`<div class="board" id="board">`;
  h+=`<div class="deckrow"><div class="stat ammo"><div class="l">AMMO</div><div class="v">${fmt(S)}</div></div>
     <div><div class="deck ${leg.shuffling?'shuffling':''}" ${leg.auto?'':'data-act="deal" role="button" aria-label="Deal next card"'}>${backHTML()}${backHTML()}${backHTML()}</div><div class="deckcap">Card # <b>${leg.cards.length}</b></div></div>
     <div class="stat mult"><div class="l">MULTIPLIER</div><div class="v">${(leg.j?ladder(cfg,S,leg.j)/S:1).toFixed(2)}x</div></div></div>`;
  const redsHud=`<span class="badge" style="margin-top:-4px">REDS <b style="color:var(--gold);font-size:14px;letter-spacing:0">${leg.j}</b> OF ${capRung(cfg,S,st.buy.cap,roundT(st),leg.h)}</span>`;

  // message
  let msg='<div class="msg"></div>';
  if(st.ended){ msg='<div class="msg"></div>'; }
  else if(cfg.opening&&!leg.seenRed&&leg.cards.length===0){ msg=`<div class="msg"><p>Nothing can bust before your first red card.</p></div>`; }
  // card row
  let row='';
  const shown=leg.cards.slice(-4);
  shown.forEach(c=>{ const hl=leg.state==='busted'&&leg.bustPair&&leg.bustPair.includes(c.id); row+=cardHTML(c,(hl?'hl ':'')+animClass(c.id)); });
  for(let i=shown.length;i<4;i++) row+='<div class="slot"></div>';
  h+=msg+`<div class="slots">${row}</div></div>`+redsHud;
  // controls
  let ctl='';
  if(st.bankedBust){
    ctl='';
  }else if(st.bar){
    ctl=ribbon('bar');
  }else if(leg.state==='busted'&&st.ended){
    ctl=endControls(st);
  }else if(leg.state==='busted'){
    ctl='';
  }else if(leg.live){
    ctl=lockSlot(st,leg,cur)+`<div class="compact">
      <${leg.auto?'div class="bigbtn next info"':'button class="bigbtn next" data-act="deal"'}>${suitSvg('D','s')}<div><div class="lab">NEXT RED CARD</div><div class="amt">${fmt(next)}</div></div></${leg.auto?'div':'button'}></div>`;
  }else{
    ctl= lockSlot(st,leg,leg.j?riding(leg):0) + (leg.auto
      ? `<div class="bigbtn next info">${suitSvg('D','s')}<div><div class="lab">${leg.shuffling?'SHUFFLING · NEXT RED CARD':'NEXT RED CARD'}</div><div class="amt">${fmt(next)}</div></div>${suitSvg('H','s')}</div>`
      : `<button class="bigbtn next" data-act="deal">${suitSvg('D','s')}<div><div class="lab">NEXT RED CARD</div><div class="amt">${fmt(next)}</div></div>${suitSvg('H','s')}</button>`);
  }
  if(AUTO_TABS.has(id)&&(leg.state==='play')) ctl+=`<button class="autotog" data-act="autotoggle" aria-pressed="${leg.auto}"><span class="sw"></span>AUTO DEAL</button>`;
  h+=`<div class="controls">${ctl}</div>`;
  return h;
}

/* Global rule: a lost run with DOUBLE HALF money banked brings that money back as the held amount */
function bankedBust(st,check){
  const B=st.buy.runBanked;
  setTimeout(()=>{ if(!check())return;
    st.bankedBust={B,phase:'stamp',shown:false}; render();
    setTimeout(()=>{ if(!check()||!st.bankedBust)return;
      st.buy.runBanked=0; st.buy.continues++;   // the RUN BANK becomes held; the wallet doesn't move
      st.bankedBust=null;
      track('banked_continue',{banked_amount:B/100,continue_count:st.buy.continues});
      barEnter(st,B); render();
    },1300);
  },550);
}
function renderRun(id,st){
  const R=st.run; let h='';
  h+=`<div class="board" id="board"><div class="rgpanel"><b>DOUBLE OR NOTHING</b><small>50/50 · FIRST TO THREE</small></div>`;
  h+=`<div class="deckrow"><div class="stat ammo"><div class="l">RUNNING</div><div class="v">${fmt(R.amount)}</div></div>
      <div><div class="deck ${R.state==='play'?'shuffling':''}">${backHTML()}${backHTML()}${backHTML()}</div><div class="deckcap">Card # <b>${R.cards.length}</b></div></div>
      <div class="stat"><div class="l">TO WIN</div><div class="v" style="color:var(--gold)">${fmt(2*R.amount)}</div></div></div>`;
  h+=`<div class="race"><div class="track"><div class="l">RED · DOUBLES</div><div class="dots">${[0,1,2].map(i=>`<span class="dot ${i<R.reds?'r':''}"></span>`).join('')}</div></div>
      <div class="track"><div class="l">BLACK · BUST</div><div class="dots">${[0,1,2].map(i=>`<span class="dot ${i<R.blacks?'b':''}"></span>`).join('')}</div></div></div>`;
  const shown=R.cards.slice(-5); let row=shown.map(c=>cardHTML(c,animClass(c.id))).join('');
  for(let i=shown.length;i<4;i++) row+='<div class="slot"></div>';
  let msg='<div class="msg"></div>';
  if(R.state==='won'&&!st.bar) msg=`<div class="msg good"><h3>DOUBLED</h3><p style="font-size:18px;font-weight:800">${fmt(2*R.amount)}</p></div>`;
  else if(R.state==='taken'&&!st.bar) msg=`<div class="msg good"><h3>LOCKED IN ${fmt(R.holding)}</h3><p>${R.reds}–${R.blacks}</p></div>`;
  else if(R.state==='play') msg=`<div class="msg"><p>${R.cards.length?'Lock in the offer, or deal the next card. Both are worth the same on average.':'First to three: three reds doubles it, three blacks busts.'}</p></div>`;
  h+=msg+`<div class="slots" style="gap:6px">${row}</div></div>`;
  let ctl='';
  if(st.bankedBust) ctl='';
  else if(st.bar) ctl=ribbon('bar');
  else if(st.ended) ctl=endControls(st);
  else if(R.state==='play'&&R.cards.length) ctl=`<div class="racerow">`+ribbon('lock',{race:R.id,n:R.cards.length,banked:st.buy.runBanked/100,maxWin:(st.buy.mw-st.buy.paid)/100,half:false,act:'racelock'})
    +`<button class="bigbtn next" data-act="racenext" data-primary><div><div class="lab">NEXT CARD</div><div class="amt">CARD ${R.cards.length+1}</div></div></button></div>`;
  h+=`<div class="controls">${ctl}</div>`;
  return h;
}

function renderResult(id,st){
  const r=st.result; let h='', head='', pre='';
  if(r.kind==='mw'||r.kind==='run'){
    pre+=toastBoard(r, JSON.stringify({variant:tdef(id).name,title:r.kind==='mw'?'MAX WIN':'1,000× RUN',paid:r.last/100,runBank:(r.runBank||0)/100}));
  }else if(r.cash){   // CASH OUT: <VARIANT> / CASHED OUT / PAID total (+ INCLUDES RUN BANK); plain at or below the stake
    pre+=toastBoard(r, JSON.stringify({variant:tdef(id).name,title:'CASHED OUT',paid:r.cash.total/100,runBank:r.cash.runBank/100,plain:r.cash.total<=st.buy.orig}));
  }
  h+=pre;
  h+=`<div class="controls"><div class="result" style="gap:6px">${head}</div>${ribbon('end')}</div>`;
  return h;
}

/* ================= actions ================= */
function startTab(id){
  const st=app.S[id]; if(app.wallet<st.stake)return;
  newBuy(st,id); st.result=null; st.run=null; st.ended=null; st.pending=null; if(st.leg) clearTimeout(st.leg.timer); st.leg=null;
  st.leg=newLeg(CFG[id],st.stake,st.buy); st.screen='crash';
  if(AUTO_TABS.has(id)){ st.leg.auto=true; const leg=st.leg; leg.timer=setTimeout(()=>autoLoop(st,id,leg),450); }
  render();
}
/* Continuous deal: shuffle, deal, hold the cash-out window on a red, repeat until bust or cash-out.
   The next card is drawn only when it is dealt, after the window closes (spec 3.7). */
const AUTO_TABS=new Set(['classic']);
const AUTO={shuffle:520,red:1600,black:700};
function autoAlive(st,leg){return st.leg===leg&&st.screen==='crash'&&leg.state==='play'&&leg.auto}
function autoLoop(st,id,leg){
  if(!autoAlive(st,leg))return;
  leg.shuffling=true; leg.winMs=0; render();
  leg.timer=setTimeout(()=>{
    if(!autoAlive(st,leg))return;
    leg.shuffling=false;
    doDeal(st,leg);
    if(leg.state!=='play')return;
    const wait=leg.live?AUTO.red:AUTO.black;
    leg.winMs=leg.live?wait:0; leg.winStart=performance.now();
    render();
    leg.timer=setTimeout(()=>autoLoop(st,id,leg),wait);
  },AUTO.shuffle);
}
function doDeal(st,leg){
  legDeal(leg);
  if(leg.state==='busted'){ legBusted(st,leg); return; }
  if(leg.state==='capped'){ render(); setTimeout(()=>{ if(st.leg===leg&&leg.state==='capped'&&st.screen==='crash'){ toChoice(st,leg,true); render(); } },900); return; }   // once, and never from the lobby (resume re-arms it)
}
function toChoice(st,leg,top){
  const amt=riding(leg); leg.state='ended'; clearTimeout(leg.timer);
  st.pending={amount:amt,top,cards:leg.cards.slice(),leg:{cfg:leg.cfg,S:leg.S,j:leg.j,h:leg.h,prev:leg.prev,seenRed:leg.seenRed}};
  st.screen='choice';
  barEnter(st,amt);
}
/* a busted board: banked half-play money comes back into play, otherwise BUSTED -> end bar */
function legBusted(st,leg,delay=650){
  render();
  const check=()=>st.leg===leg&&st.screen==='crash';
  if(st.buy.runBanked>0) bankedBust(st,check); else endCrash(st,check,delay);
}
/* the door: a pending run bar is cashed out; an unfinished build is kept for RESUME ROUND */
function doorOut(st){
  if(st.screen==='lobby')return;
  if(st.leg) clearTimeout(st.leg.timer);
  if(st.bar){ settle(st,st.bar.held); endRound(st); }
  else if(st.screen==='crash'&&st.leg&&st.leg.live&&st.leg.state==='play'&&!st.bankedBust){ settle(st,riding(st.leg)); endRound(st); }   // abandoned at LOCK IN: lock in and cash out, never run
  else if(st.bankedBust&&st.bankedBust.phase==='stamp'){ settle(st); endRound(st); }   // an abandoned round cashes out and never runs
  else if(st.screen==='result'||st.ended){ endRound(st); }
  else { st.paused={screen:st.screen}; if(st.leg){ st.leg.shuffling=false; } }
  st.screen='lobby';
}
function endRound(st){ st.bar=null; st.bankedBust=null; st.pending=null; st.paused=null; st.ended=null; st.result=null; st.leg=null; st.run=null; }
function resumeRound(st){
  const ps=st.paused; if(!ps)return; st.paused=null; st.screen=ps.screen; const id=st.id;
  if(ps.screen==='crash'){ const leg=st.leg;
    if(leg.state==='play'&&leg.auto) leg.timer=setTimeout(()=>autoLoop(st,id,leg),400);
    else if(leg.state==='busted'&&!st.ended&&!st.bankedBust) legBusted(st,leg,300);
    else if(leg.state==='capped') setTimeout(()=>{ if(st.leg===leg&&leg.state==='capped'&&st.screen==='crash'){ toChoice(st,leg,true); render(); } },400);
  }
  else if(ps.screen==='run'){ const R=st.run; if(R.state==='crash'&&!st.ended&&!st.bankedBust&&!st.bar){ const ck=()=>st.run===R&&st.screen==='run'; if(st.buy.runBanked>0) bankedBust(st,ck); else endCrash(st,ck,300); }
    else if(R.state==='won'&&!st.ended&&!st.bankedBust&&!st.bar){ clearTimeout(R.t); R.t=setTimeout(()=>{ if(!raceAlive(st,R)||st.bar)return; barEnter(st,R.holding); render(); },400); }   // DOUBLED, left at the door: the bar opens on the win
    else if(R.state==='play'&&!R.cards.length){ clearTimeout(R.t); R.t=setTimeout(()=>{ raceDeal(st,R); },450); } }   // left before the first card: deal it
}
function act(a,el){
  const st=app.S[app.tab], id=app.tab;
  switch(a){
    case 'betmax': setStake(st,Math.min(Math.floor(app.wallet/BET_STEP)*BET_STEP,TABLE_MAX)); break;   // MAX = min(balance floored to $0.10, $100); under $1 the lobby shows the too-low state
    case 'start': case 'again': startTab(id); return;
    case 'lobby': endRound(st); st.screen='lobby'; break;
    case 'racenext': { const R=st.run; if(!R||R.state!=='play')return; raceDeal(st,R); return; }
    case 'racelock': raceLock(st); break;
    case 'door': doorOut(st); if(CardRunRules.isOpen()) CardRunRules.close(); break;
    case 'resume': resumeRound(st); break;
    case 'bar-cash': { if(!st.bar)return; track('run_choice',{choice:'cash_out',stake:st.bar.held/100,banked_amount:st.buy.runBanked/100}); const bank=st.buy.runBanked, total=settle(st,st.bar.held); st.result={kind:'won',boardHTML:boardSnap(),cash:{total,runBank:bank}}; st.bar=null; st.pending=null; st.screen='result'; break; }
    case 'bar-double': case 'bar-doublehalf': { if(!st.bar)return; const S=st.bar.held, h=a==='bar-doublehalf'; track('run_choice',{choice:h?'double_half':'double_it',stake:(h?Math.floor(S/2):S)/100,banked_amount:(st.buy.runBanked+(h?S-Math.floor(S/2):0))/100}); startRun(st,S,h?'half':'it'); break; }
    case 'deal': {
      const leg=st.leg; if(!leg||leg.state!=='play'||leg.auto)return;
      doDeal(st,leg); if(leg.state!=='play')return;
      break; }
    case 'autotoggle': { const leg=st.leg; if(!leg||leg.state!=='play')return; clearTimeout(leg.timer); leg.shuffling=false; leg.winMs=0; leg.auto=!leg.auto; if(leg.auto){ leg.timer=setTimeout(()=>autoLoop(st,id,leg),250); } break; }
    case 'cashout': { const leg=st.leg; if(!leg||!leg.live)return; clearTimeout(leg.timer); track('lock_in',{amount:riding(leg)/100,build_step:leg.j,pay_x:+(riding(leg)/leg.S).toFixed(4),phase:'build',half:false});
      toChoice(st,leg,false); break; }
  }
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled||b.closest('.crk-bar,.crk-one'))return; if(performance.now()<lockUntil&&b.closest('.controls'))return; act(b.dataset.act,b);
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.bet; if(!id)return;
  const c=parseBetCents(e.target.value), b=document.querySelector('[data-act=start]');
  const a=b&&b.querySelector('.a'); if(a&&c!=null) a.textContent=startLabel(id,snapBet(c));
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.bet; if(!id)return;
  const c=parseBetCents(e.target.value); if(c!=null) setStake(app.S[id],c); render();   // rejected input: the field shows the bet unchanged
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][role="button"]')){e.preventDefault();if(performance.now()<lockUntil&&e.target.closest('.controls'))return;act(e.target.dataset.act,e.target)}
});


/* ================= rules & pays sheet (rules-sheet.js v1, RULES-CONTENT.txt · CRASH 20×) =================
   Every number in the PAYS table is computed when the sheet opens, at the current bet, from the game's own
   CFG / ladder / reach / capRung and the bet and MAX WIN constants: exactly what the game pays. */
const rulesX=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'×';
const rulesHTML=()=>{
  const st=app.S[app.tab], S=st.stake, cfg=CFG.classic, t=tdef('classic'), M=1e6;   // M: a notional bet of $10,000 shows each multiplier to 4 decimals
  const top=capRung(cfg,S,Math.min(t.cap*S,maxWinC(S))), xOf=j=>ladder(cfg,M,j)/M;
  const rows=[]; for(let j=1;j<=top;j++) rows.push(`<tr><td>#${j}</td><td>${rulesX(xOf(j))}</td><td>${fmt(ladder(cfg,S,j))}</td><td>1 in ${(1/reach(cfg,j)).toFixed(1)}</td></tr>`);
  const mwX=Math.min(MAX_WIN_X,OPERATOR_MAX_WIN_X).toLocaleString('en-US');
  return `<h3>How to play</h3>
<p>Cards are dealt one at a time, each drawn from a full deck, so every card is independent. Every red card climbs the ladder: the first red pays ${rulesX(xOf(1))} your bet and each red after it pays 1.2× the one before. Nothing can crash before the first red. After it, a club straight after a club, or a spade straight after a spade, crashes the build and it pays nothing.</p>
<p>Tap <b>LOCK IN</b> to take the current red's pay. Cards deal by themselves; switch <b>AUTO DEAL</b> off to deal each card yourself. Red #${top} is the top of the build: it pays its full ${rulesX(xOf(top))} and ends the build.</p>
<h3>Pays</h3>
<table class="crr-t"><thead><tr><th>Red</th><th>× bet</th><th>Pays at ${fmt(S)}</th><th>Chance</th></tr></thead><tbody>${rows.join('')}</tbody></table>
<p class="crr-note">Locking in at red #1 pays ${rulesX(xOf(1))}, less than your bet. Chance = how often a build reaches that red.</p>
<h3>Run it</h3>
<div class="crr-key">20× is the build target: the step that reaches it pays its full multiplier, which can be a little over 20× (red #18 pays 20.63×). A 1,000× run works the same way: you can keep running until your total reaches 1,000× your first win, and the run that crosses 1,000× pays in full. No round pays more than the max win of ${mwX}× your bet.</div>
<p>After any win, including a return of your bet or less, the run bar opens:</p>
<p><b>CASH OUT</b> takes everything you hold.</p>
<p><b>DOUBLE OR NOTHING</b> is first to three: three reds before three blacks doubles the amount. After every card you can <b>LOCK IN</b> the offer shown — the fair value of your position, rounded down — or deal the next card.</p>
<p><b>DOUBLE HALF</b> doubles half of what you hold and puts the other half (plus any odd cent) in your <b>RUN BANK</b>. The RUN BANK is paid with everything else when the round ends; if a double loses, the RUN BANK comes back to cash out or double.</p>
<p>The minimum run is $0.02. A run that pays nothing ends the round.</p>
<h3>Return to player</h3>
<table class="crr-t"><thead><tr><th>Play</th><th>Return</th></tr></thead><tbody>
<tr><td>Build, any stop</td><td>93.0%</td></tr>
<tr><td>Lowest at small bets (rounding to the cent)</td><td>92.3%</td></tr>
<tr><td>DOUBLE OR NOTHING</td><td>100.0%</td></tr></tbody></table>
<p class="crr-note">When you lock in doesn't change the return.</p>
<h3>Limits</h3>
<p>Bets: ${fmt(TABLE_MIN)} to ${fmt(TABLE_MAX)} in ${fmt(BET_STEP)} steps.</p>
<p>Max win: ${mwX}× your bet per round. Your operator may set a lower max win; every payout stops at the max win.</p>
<p>Pays are rounded down to the cent.</p>
<p class="crr-note">Results are decided by the game's random number generator. A malfunction voids all pays and plays.</p>
<p class="crr-note">Return-to-player figures are long-run averages for the play described; any single round can return more or less.</p>`;
};
/* Crash deals on its own: while the sheet is open no card is dealt (auto deal and the DOUBLE OR NOTHING first card wait) */
let RULES_HOLD=null;
const rulesPause=()=>{ const st=app.S[app.tab]; RULES_HOLD=null;
  if(st.screen==='crash'&&st.leg&&st.leg.state==='play'&&st.leg.auto){ const leg=st.leg; clearTimeout(leg.timer); leg.shuffling=false; leg.winMs=0; RULES_HOLD={leg}; render(); }
  else if(st.screen==='run'&&st.run&&st.run.state==='play'&&!st.run.cards.length){ clearTimeout(st.run.t); RULES_HOLD={run:st.run}; } };
const rulesResume=()=>{ const h=RULES_HOLD, st=app.S[app.tab]; RULES_HOLD=null; if(!h)return;
  if(h.leg&&st.leg===h.leg&&st.screen==='crash'&&h.leg.state==='play'&&h.leg.auto){ const leg=h.leg; leg.timer=setTimeout(()=>autoLoop(st,st.id,leg),400); }
  else if(h.run&&st.run===h.run&&st.screen==='run'&&h.run.state==='play'&&!h.run.cards.length){ h.run.t=setTimeout(()=>{ raceDeal(st,h.run); },450); } };
CardRunRules.mount({button:document.getElementById('rulesBtn'),title:tdef('classic').name,content:rulesHTML,onOpen:rulesPause,onClose:rulesResume});

render();
</script>
